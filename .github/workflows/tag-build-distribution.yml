# Build the distribution packages for a pushed tag and publish them as workflow artifacts.
#
# The tag is an input only: this workflow never creates a commit, tag, release or push, because
# writing a ref back would re-trigger this same workflow on its own tag and recurse. Artifacts
# land in the run's "Artifacts" section; publishing them anywhere is a deliberate, separate step.
name: Tag-Build-Distribution

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Declared explicitly so a future change to the repository's default token permissions cannot
# silently hand this job write access to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_OPTS: -Xms2g -Xmx4g -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false -Dmaven.wagon.http.retryHandler.class=standard -Dmaven.wagon.http.retryHandler.count=3
  MAVEN_ARGS: --batch-mode --no-transfer-progress
  DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}

jobs:
  build-distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 17
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-
      # Builds the module ZIPs that distribution assembles (including the external service fat
      # jars) in the same reactor.
      - name: Package distribution
        shell: bash
        run: mvn clean package -pl distribution -am -DskipTests
      - name: Upload distribution packages
        uses: actions/upload-artifact@v6
        with:
          name: iotdb-distribution-${{ github.ref_name }}
          path: |
            distribution/target/apache-iotdb-*-bin.zip
            distribution/target/apache-iotdb-*-bin.zip.sha512
          if-no-files-found: error

  zh-locale-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 17
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-
      - name: Compile with ZH locale
        shell: bash
        run: mvn test-compile -P with-zh-locale -DskipTests
